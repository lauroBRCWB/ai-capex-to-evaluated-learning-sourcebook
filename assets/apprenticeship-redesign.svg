<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Redesigning the apprenticeship path when AI removes routine work</title>
  <desc id="desc">A comparison between a broken learning path and a deliberately redesigned path to expert judgment.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#087f8c"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c04444"/></marker></defs>
  <rect width="1200" height="650" rx="28" fill="#071426"/>
  <text x="65" y="65" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700">When routine work disappears, learning must be redesigned</text>
  <text x="65" y="103" fill="#cfe8ec" font-family="DejaVu Sans,Arial" font-size="19">Faster output today can weaken the future supply of experts if practice, feedback and progressive authority vanish.</text>

  <rect x="65" y="150" width="1070" height="185" rx="20" fill="#fff5f5"/>
  <text x="95" y="190" fill="#9a3030" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700">Broken path: remove routine work, but keep senior expectations</text>
  <g font-family="DejaVu Sans,Arial" font-size="17" text-anchor="middle">
    <rect x="105" y="225" width="190" height="62" rx="12" fill="#ffffff" stroke="#d4a0a0"/><text x="200" y="252" fill="#42526a">Routine practice</text><text x="200" y="275" fill="#667085">removed by AI</text>
    <line x1="305" y1="256" x2="430" y2="256" stroke="#c04444" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#r)"/>
    <rect x="445" y="225" width="245" height="62" rx="12" fill="#ffffff" stroke="#d4a0a0"/><text x="567" y="252" fill="#42526a">Less coached judgment</text><text x="567" y="275" fill="#667085">and fewer edge cases</text>
    <line x1="700" y1="256" x2="825" y2="256" stroke="#c04444" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#r)"/>
    <rect x="840" y="225" width="240" height="62" rx="12" fill="#ffffff" stroke="#d4a0a0"/><text x="960" y="252" fill="#9a3030" font-weight="700">Expertise bottleneck</text><text x="960" y="275" fill="#667085">masked by short-term speed</text>
  </g>

  <rect x="65" y="370" width="1070" height="205" rx="20" fill="#effaf9"/>
  <text x="95" y="411" fill="#087f8c" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700">Redesigned path: preserve the experience, not the manual inefficiency</text>
  <g font-family="DejaVu Sans,Arial" font-size="16" text-anchor="middle">
    <rect x="95" y="452" width="175" height="70" rx="12" fill="#ffffff" stroke="#7bc9c4"/><text x="182" y="481" fill="#42526a">Simulation and</text><text x="182" y="504" fill="#42526a">reviewed cases</text>
    <line x1="280" y1="487" x2="335" y2="487" stroke="#087f8c" stroke-width="5" marker-end="url(#a)"/>
    <rect x="350" y="452" width="175" height="70" rx="12" fill="#ffffff" stroke="#7bc9c4"/><text x="437" y="481" fill="#42526a">Mentorship and</text><text x="437" y="504" fill="#42526a">explicit feedback</text>
    <line x1="535" y1="487" x2="590" y2="487" stroke="#087f8c" stroke-width="5" marker-end="url(#a)"/>
    <rect x="605" y="452" width="175" height="70" rx="12" fill="#ffffff" stroke="#7bc9c4"/><text x="692" y="481" fill="#42526a">Progressive decision</text><text x="692" y="504" fill="#42526a">authority</text>
    <line x1="790" y1="487" x2="845" y2="487" stroke="#087f8c" stroke-width="5" marker-end="url(#a)"/>
    <rect x="860" y="452" width="215" height="70" rx="12" fill="#ffffff" stroke="#7bc9c4"/><text x="967" y="481" fill="#087f8c" font-weight="700">Verified judgment</text><text x="967" y="504" fill="#42526a">under real conditions</text>
  </g>
  <text x="65" y="616" fill="#cfe8ec" font-family="DejaVu Sans,Arial" font-size="16">Leadership test: who will become tomorrow’s expert, and through which observable learning experiences?</text>
</svg>
